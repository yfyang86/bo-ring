[package]
name = "bo-ring"
version = "0.2.0-mac.4"
edition = "2024"
authors = ["BazinFla"]
repository = "https://github.com/BazinFla/bo-ring"
description = "The Button Overlay Ring & hardware button remapper — macOS port"
license = "MIT"
readme = "README.md"
keywords = ["bo-ring", "action-ring", "radial-menu", "macos", "mouse-remapper"]
categories = ["command-line-utilities", "gui", "hardware-support"]

[[bin]]
name = "bo-ring"
path = "src/main.rs"



[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", features = ["webp", "png"] }
rfd = "0.14"
libc = "0.2"

# macOS platform layer (versions shared with eframe 0.28 / winit 0.29)
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
core-graphics = "0.23"
core-foundation = "0.9"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSEnumerator", "NSThread", "NSGeometry", "NSValue"] }
objc2-app-kit = { version = "0.2", features = ["libc", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSEvent", "NSGraphicsContext", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSCell"] }
winit = { version = "0.29", default-features = false }

