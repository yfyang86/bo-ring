name: CI (macOS)

on:
  push:
    branches: [main, bo-ring-mac]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Build DMG
        run: scripts/build-dmg.sh
      - name: Verify DMG
        run: hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Bo-Ring-dmg
          path: dist/*.dmg
          retention-days: 14
